# Scans the full Git history for secrets on every pull request and every push to main.
# Action versions checked in Stage A (Sept 24, 2026): actions/checkout v7, gitleaks-action v3.
# Personal-account repos need no GITLEAKS_LICENSE. Re-check before activating.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
