# Scans the full Git history for secrets on every pull request and every push to main.
# Actions are pinned to full commit SHAs (P0-10), checked 2026-10-19: actions/checkout v7.0.1,
# gitleaks-action v3.0.0. Dependabot proposes updates; the comment after each SHA names its tag.
# Personal-account repos need no GITLEAKS_LICENSE (gitleaks-action README).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token (P0-16): every job reads the code only, and the scan job
# alone may also comment on pull requests so gitleaks can flag a found secret on its line.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # no token copy in .git/config; gitleaks uses env (P0-17)

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
