# Scans the full Git history for secrets on every pull request and every push to main.
# Action versions re-checked 2026-10-14 when activated: actions/checkout v7 (v7.0.1), gitleaks-action v3 (v3.0.0).
# Personal-account repos need no GITLEAKS_LICENSE (gitleaks-action README).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
