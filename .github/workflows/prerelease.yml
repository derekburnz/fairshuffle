# Builds FairShuffle.exe with PyInstaller (D25) on Windows and, for a version tag, publishes the
# zip as a GitHub pre-release (#34). Pushing a tag is Derek's call (Rule 3); this only reacts.
# On a pull request that touches the build, it builds and smoke tests without publishing, so a
# broken build shows up before a tag does.
# Actions are pinned to full commit SHAs like ci.yml (P0-10), checked 2026-10-25:
# actions/checkout v7.0.1, astral-sh/setup-uv v10.3.0, actions/upload-artifact v7.0.2,
# actions/download-artifact v8.0.2. Dependabot proposes updates; the comment after each SHA
# names its tag.
name: Pre-release build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_exe.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/prerelease.yml"
  workflow_dispatch:

# Least privilege (P0-16): only the publish job may write, and only to releases and tags.
permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false  # never cut off a publish halfway

jobs:
  build:
    name: build FairShuffle.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no token copy left in .git/config (P0-17)

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies and PyInstaller from the lockfile
        run: uv sync --locked --group build

      - name: Read the app version
        id: version
        shell: pwsh
        run: |
          $version = uv run --group build python -c "import fairshuffle; print(fairshuffle.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: A tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$env:VERSION") {
            Write-Error "Tag $env:TAG doesn't match the app version $env:VERSION in src/fairshuffle/__init__.py"
            exit 1
          }

      - name: Build and zip
        run: uv run --group build python scripts/build_exe.py --zip

      - name: Smoke test the exe
        shell: pwsh
        run: |
          # A windowed exe has no console, so --version prints nothing; its exit code shows the
          # bundled Python and FairShuffle's entry point start.
          $run = Start-Process -FilePath dist\FairShuffle\FairShuffle.exe -ArgumentList "--version" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Write-Error "FairShuffle.exe --version exited with $($run.ExitCode)"; exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }

      - name: Keep the zip for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fairshuffle-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release and attach the zip
    steps:
      - name: Fetch the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fairshuffle-windows
          path: dist

      - name: Create the pre-release, or add the zip to one Derek already wrote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.zip.sha256 --verify-tag --prerelease \
              --title "FairShuffle $TAG" \
              --notes "Prototype build for Windows. Unzip it, copy your .env next to FairShuffle.exe and run it. The .exe isn't code signed yet, so Windows may warn before it runs."
          fi
