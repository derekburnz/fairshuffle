# Copied to the repo root in Phase 0 step 4 (2026-10-14). Since issue #3 (P1-01) added
# src/fairshuffle, plain `uv sync` installs the package and its dependencies from uv.lock.
# Versions are lower bounds checked on PyPI 2026-10-09.
# Depends on D18 (Python 3.14), D19 (uv), D20 (ruff + pyright + pytest), D21 (PySide6-Essentials),
# D22 (src layout) and D23 (pre-commit framework). Runtime dependencies for later phases (for example keyring after D10)
# are added in the PR that needs them, listed under "New dependencies" for Derek to approve.

[project]
name = "fairshuffle"
version = "0.4.0"
description = "A Windows tray app that gives a Spotify playlist a true Fisher-Yates shuffle."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7",
    "PySide6-Essentials>=6.12",
    "python-dotenv>=1.2",
    "requests>=2.34",
]

[project.gui-scripts]
fairshuffle = "fairshuffle.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pyright[nodejs]>=1.1.414",  # [nodejs] bundles Node, so no separate Node install
    "pytest>=9.1",
    "pytest-qt>=4.5",
    "pytest-cov>=7.1",
    "pre-commit>=4.6",  # runs the hooks in .pre-commit-config.yaml (D23)
    "responses>=0.26",  # fake Spotify replies for requests in tests (P2-2)
    "pytest-socket>=0.8",  # fails any test that connects anywhere but this PC (P2-2)
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP modern syntax,
# SIM simplifications, S bandit security checks (flags things like hard-coded secrets).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and obviously fake test credentials

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --allow-hosts=127.0.0.1,::1"  # no test may reach the real network (P2-2)
# Unknown markers, config typos and passing xfail tests become errors instead of silent warnings.
strict = true

[tool.coverage.run]
source = ["fairshuffle"]
branch = true  # also checks that both sides of each if statement ran

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
